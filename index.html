<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>photobooth</title>
  <!-- Cache-busting ?v= query on script/style: GitHub Pages serves these
       with cache-control: max-age=600, so bump this version string any
       time script.js/style.css change, or returning visitors' browsers
       can silently keep serving an old cached copy for up to 10 minutes
       (or longer, depending on the browser) after a new deploy. -->
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <video id="webcam-video" autoplay muted playsinline></video>
  <canvas id="effects-canvas"></canvas>

  <div id="status-bar">
    <span id="brand">photobooth</span>
    <span class="status-pill" id="webcam-status">webcam: idle</span>
    <span class="status-pill" id="hand-status">hand: idle</span>
  </div>

  <div id="photo-strip" aria-label="Photo strip"></div>

  <!-- Custom-size save: opened by the small save button on any filled strip
       slot. Lets you download that one photo resized to whatever width/
       height you choose, independent of the strip's fixed square slots. -->
  <div id="size-picker-overlay" class="modal-overlay" hidden>
    <div class="modal-card">
      <h3>Save Photo</h3>
      <img id="size-picker-preview" class="size-picker-preview" alt="Photo preview" />
      <div class="size-picker-row">
        <label>Width
          <input id="size-picker-width" type="number" min="16" max="4000" step="1" />
        </label>
        <span class="size-picker-x">×</span>
        <label>Height
          <input id="size-picker-height" type="number" min="16" max="4000" step="1" />
        </label>
      </div>
      <label class="size-picker-lock">
        <input id="size-picker-lock" type="checkbox" checked />
        Keep aspect ratio
      </label>
      <div class="modal-actions">
        <button id="size-picker-cancel" type="button" class="btn-secondary">Cancel</button>
        <button id="size-picker-save" type="button" class="btn-primary">Save PNG</button>
      </div>
    </div>
  </div>

  <!-- Round-complete save choice: shown once all 4 strip slots fill.
       Choosing "Save Strip" and/or "Save All 4" can both be done before
       finishing -- only "Done" resets the round for the next one. -->
  <div id="round-complete-overlay" class="modal-overlay" hidden>
    <div class="modal-card round-complete-card">
      <h3>4 Photos Ready</h3>
      <div id="round-complete-thumbs" class="round-complete-thumbs"></div>

      <div class="round-complete-section">
        <p class="round-complete-label">Combined strip</p>
        <button id="round-save-strip" type="button" class="btn-primary round-complete-btn">Save Strip</button>
      </div>

      <div class="round-complete-section">
        <p class="round-complete-label">Each photo individually</p>
        <div class="round-size-choice">
          <label><input type="radio" name="round-size" id="round-size-square" checked /> Square (matches strip)</label>
          <label><input type="radio" name="round-size" id="round-size-custom" /> Custom size</label>
        </div>
        <div id="round-custom-fields" class="size-picker-row" hidden>
          <label>Width
            <input id="round-custom-width" type="number" min="16" max="4000" step="1" />
          </label>
          <span class="size-picker-x">×</span>
          <label>Height
            <input id="round-custom-height" type="number" min="16" max="4000" step="1" />
          </label>
        </div>
        <button id="round-save-individual" type="button" class="btn-primary round-complete-btn">Save All 4</button>
      </div>

      <div class="modal-actions">
        <button id="round-done" type="button" class="btn-secondary">Done</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=3" type="module"></script>
</body>
</html>
