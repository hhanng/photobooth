<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>photobooth</title>
  <!-- Cache-busting ?v= query on script/style: GitHub Pages serves these
       with cache-control: max-age=600, so bump this version string any
       time script.js/style.css change, or returning visitors' browsers
       can silently keep serving an old cached copy for up to 10 minutes
       (or longer, depending on the browser) after a new deploy. -->
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <video id="webcam-video" autoplay muted playsinline></video>
  <canvas id="effects-canvas"></canvas>

  <div id="status-bar">
    <span id="brand">photobooth</span>
    <span class="status-pill" id="webcam-status">webcam: idle</span>
    <span class="status-pill" id="hand-status">hand: idle</span>
  </div>

  <div id="photo-strip" aria-label="Photo strip"></div>

  <!-- Custom-size save: opened by the small save button on any filled strip
       slot. Lets you download that one photo resized to whatever width/
       height you choose, independent of the strip's fixed square slots. -->
  <div id="size-picker-overlay" class="modal-overlay" hidden>
    <div class="modal-card">
      <h3>Save Photo</h3>
      <img id="size-picker-preview" class="size-picker-preview" alt="Photo preview" />
      <div class="size-picker-row">
        <label>Width
          <input id="size-picker-width" type="number" min="16" max="4000" step="1" />
        </label>
        <span class="size-picker-x">×</span>
        <label>Height
          <input id="size-picker-height" type="number" min="16" max="4000" step="1" />
        </label>
      </div>
      <label class="size-picker-lock">
        <input id="size-picker-lock" type="checkbox" checked />
        Keep aspect ratio
      </label>
      <div class="modal-actions">
        <button id="size-picker-cancel" type="button" class="btn-secondary">Cancel</button>
        <button id="size-picker-save" type="button" class="btn-primary">Save PNG</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=2" type="module"></script>
</body>
</html>
